<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem('tvicTheme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Info — TV Install Chicago</title>
<meta name="description" content="Share your name, phone, and email with TV Install Chicago.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tvserviceschicago.com/info.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="/css/tailwind.min.css">
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #F5F0E8;
    --gold: #C8A94A;
    --gold-light: #E5C97A;
    --rust: #A8471F;
  }
  * { box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
  .bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  body { background: var(--ink); color: var(--paper); }
  .panel { background: var(--surface, #141414); border: 1px solid rgba(var(--gold-rgb, 200,169,74),0.15); }
  .btn-gold { background: var(--gold); color: var(--on-gold, #0A0A0A); font-weight: 700; }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
  input {
    background: var(--surface-2, #1D1D1D); border: 1px solid rgba(var(--paper-rgb, 245,240,232),0.15); color: var(--paper);
  }
  input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(var(--gold-rgb, 200,169,74),0.25); }
  ::placeholder { color: rgba(var(--paper-rgb, 245,240,232),0.35); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .spinner {
    border: 2px solid rgba(var(--ink-rgb, 10,10,10),0.25); border-top-color: var(--ink); border-radius: 50%;
    width: 16px; height: 16px; animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/theme.js" defer></script>
</head>
<body class="min-h-screen">
<main>

<div class="max-w-md mx-auto px-5 py-16">

  <header class="text-center mb-8">
    <p class="text-xs uppercase tracking-widest" style="color:var(--gold-text, #C8A94A);">TV Install Chicago</p>
    <h1 class="bebas text-4xl mt-1 mb-2">Share Your Info</h1>
    <p class="text-sm" style="color:rgba(var(--paper-rgb, 245,240,232),0.6);">Fill this out and we'll have your details on file.</p>
  </header>

  <form id="infoForm" class="panel rounded-xl p-6 space-y-3">
    <div>
      <label for="nameInput" class="sr-only">Full name</label>
      <input id="nameInput" type="text" required placeholder="Full name *" class="w-full rounded-md px-4 py-3 text-sm">
    </div>
    <div>
      <label for="phoneInput" class="sr-only">Phone</label>
      <input id="phoneInput" type="tel" required placeholder="Phone *" class="w-full rounded-md px-4 py-3 text-sm">
    </div>
    <div>
      <label for="emailInput" class="sr-only">Email</label>
      <input id="emailInput" type="email" placeholder="Email (optional)" class="w-full rounded-md px-4 py-3 text-sm">
    </div>
    <button id="submitBtn" type="submit" class="btn-gold w-full rounded-md py-3 text-sm flex items-center justify-center gap-2">
      Send
    </button>
    <p id="formError" class="hidden text-xs text-center mt-1" style="color:var(--rust);"></p>
  </form>

  <div id="successPanel" class="hidden panel rounded-xl p-8 text-center">
    <div class="text-4xl mb-2">✓</div>
    <h2 class="bebas text-2xl mb-1" style="color:var(--gold-text, #C8A94A);">Got it, thanks!</h2>
    <p class="text-sm" style="color:rgba(var(--paper-rgb, 245,240,232),0.6);">Your info has been sent to TV Install Chicago.</p>
  </div>

</div>

<script>
const INTAKE_URL = 'https://tv-ops-public-api.tvinstallchicago.workers.dev/intake';

const form = document.getElementById('infoForm');
const submitBtn = document.getElementById('submitBtn');
const errorEl = document.getElementById('formError');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.add('hidden');

  const name = document.getElementById('nameInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Sending…';

  try {
    const res = await fetch(INTAKE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, email }),
    });
    if (!res.ok) throw new Error('Request failed');

    form.classList.add('hidden');
    document.getElementById('successPanel').classList.remove('hidden');
  } catch (err) {
    errorEl.textContent = "Something went wrong. Please try again, or just call/text us at (630) 592-2982.";
    errorEl.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send';
  }
});
</script>

<script src="/js/report-problem.js"></script></main>
</body>
</html>
